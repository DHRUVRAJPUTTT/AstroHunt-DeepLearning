
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrohunt-frontend
  labels:
    app: astrohunt-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrohunt-frontend
  template:
    metadata:
      labels:
        app: astrohunt-frontend
    spec:
      containers:
      - name: astrohunt-frontend
        image: dhruvrajput0001/astrohunt-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrohunt-backend
  labels:
    app: astrohunt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrohunt-backend
  template:
    metadata:
      labels:
        app: astrohunt-backend
    spec:
      containers:
      - name: astrohunt-backend
        image: dhruvrajput0001/astrohunt-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
